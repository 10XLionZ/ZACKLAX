<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyApp — Articles, Games & Shopping</title>
<style>
  :root {
    --purple: #6c4cf1;
    --purple-light: #f0edff;
    --ink: #202033;
    --muted: #77778b;
    --line: #ececf2;
    --bg: #f7f7fb;
    --white: #fff;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, textarea { font: inherit; }
  button { cursor: pointer; }
  .app { min-height: 100vh; max-width: 760px; margin: auto; background: var(--bg); }
  .topbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 800; font-size: 19px; white-space: nowrap; }
  .icon-btn {
    border: 0; background: transparent; color: var(--ink);
    font-size: 23px; line-height: 1; padding: 6px;
  }
  .search { flex: 1; position: relative; }
  .search input {
    width: 100%; border: 1px solid var(--line); background: var(--bg);
    border-radius: 12px; padding: 11px 13px; outline: none;
  }
  .search input:focus { border-color: var(--purple); }
  main { padding: 16px 16px 92px; min-height: 75vh; }
  .section-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin: 5px 0 14px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 19px; margin: 0 0 12px; }
  h3 { margin: 0; font-size: 16px; }
  .muted { color:var(--muted); font-size:13px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding: 2px 0 12px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex: 0 0 auto; border:1px solid var(--line); color:#55556b;
    background:#fff; border-radius:999px; padding:8px 13px; font-size:13px;
  }
  .chip.active { background:var(--purple); border-color:var(--purple); color:#fff; }
  .card {
    background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; box-shadow:0 3px 12px rgba(30,25,70,.035);
  }
  .article-list { display:grid; gap:14px; }
  .article-card { display:grid; grid-template-columns:120px 1fr; min-height:125px; }
  .article-card img { width:100%; height:100%; min-height:125px; object-fit:cover; cursor:pointer; }
  .article-copy { padding:12px; min-width:0; }
  .article-copy h3 { margin-bottom:5px; }
  .excerpt { margin:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; align-items:center; gap:8px; }
  .between { justify-content:space-between; }
  .small-btn { border:0; background:transparent; color:var(--purple); padding:5px 0; font-weight:650; }
  .like-btn { border:0; background:transparent; padding:4px; color:#777; }
  .like-btn.liked { color:#ee4c79; }
  .game-strip { display:flex; gap:10px; overflow-x:auto; margin-bottom:18px; padding-bottom:4px; }
  .played {
    flex:0 0 78px; text-align:center; cursor:pointer;
  }
  .played .emoji { display:grid; place-items:center; width:58px;height:58px;margin:0 auto 5px; background:#fff; border-radius:18px; font-size:28px; border:1px solid var(--line); }
  .played span:last-child { font-size:11px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .game-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .game-card { text-align:center; padding:10px 5px; cursor:pointer; }
  .game-icon { font-size:30px; width:54px;height:54px;display:grid;place-items:center;margin:0 auto 7px;border-radius:17px;background:var(--purple-light); }
  .game-card h3 { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .game-card .muted { font-size:10px; }
  .product-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .product-card { cursor:pointer; }
  .product-card img { width:100%; aspect-ratio:1/1; object-fit:cover; background:#eee; }
  .product-info { padding:10px; }
  .product-info h3 { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .price { font-weight:800; margin-top:5px; }
  .mrp { color:var(--muted); text-decoration:line-through; font-size:12px; margin-left:5px; font-weight:400; }
  .discount { color:#14915b; font-size:12px; margin-left:5px; }
  .profile-card { padding:18px; text-align:center; }
  .avatar { width:82px;height:82px;border-radius:50%;object-fit:cover;background:#eee; }
  .primary {
    border:0; background:var(--purple); color:#fff; border-radius:12px;
    padding:11px 16px; font-weight:700;
  }
  .secondary { border:1px solid var(--line); background:#fff; border-radius:12px; padding:9px 13px; color:var(--ink); }
  .wide { width:100%; }
  .banner {
    margin:14px 0; padding:17px; border-radius:var(--radius);
    background:linear-gradient(120deg,#765cf4,#a586ff); color:white; cursor:pointer;
  }
  .link-list { display:grid; gap:9px; margin-top:15px; }
  .link-row { display:flex; justify-content:space-between; align-items:center; background:#fff; border:1px solid var(--line); border-radius:13px; padding:13px; cursor:pointer; }
  .bottom-nav {
    position:fixed; z-index:6; bottom:0; left:50%; transform:translateX(-50%);
    width:min(760px,100%); display:grid; grid-template-columns:repeat(4,1fr);
    background:rgba(255,255,255,.97); border-top:1px solid var(--line);
    padding:7px 6px max(7px, env(safe-area-inset-bottom));
  }
  .nav-item { border:0; background:transparent; color:#8b8b9c; padding:5px 2px; display:grid; justify-items:center; gap:1px; font-size:10px; }
  .nav-item span:first-child { font-size:21px; }
  .nav-item.active { color:var(--purple); font-weight:750; }
  .drawer-backdrop { position:fixed; inset:0; background:#0006; z-index:10; display:none; }
  .drawer-backdrop.open { display:block; }
  .drawer {
    position:absolute; top:0; bottom:0; right:0; width:min(330px,86vw);
    background:#fff; padding:20px; overflow:auto; box-shadow:-10px 0 30px #0002;
  }
  .drawer-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .drawer button.option { width:100%; text-align:left; border:1px solid var(--line); background:#fff; padding:12px; border-radius:12px; margin:5px 0; }
  .drawer button.option.active { color:var(--purple); border-color:var(--purple); background:var(--purple-light); }
  .detail-image { width:100%; max-height:380px; object-fit:cover; border-radius:var(--radius); background:#eee; }
  .gallery { display:flex; gap:9px; overflow-x:auto; margin-top:9px; }
  .gallery img { width:76px;height:76px;object-fit:cover;border-radius:12px;cursor:pointer;border:2px solid transparent; }
  .gallery img.active { border-color:var(--purple); }
  .detail-panel { background:#fff; padding:16px; border-radius:var(--radius); margin-top:12px; border:1px solid var(--line); }
  .detail-title { margin:13px 0 5px; font-size:22px; }
  .comment-box { display:flex; gap:8px; margin:14px 0; }
  .comment-box input { flex:1; min-width:0; padding:12px; border:1px solid var(--line); border-radius:12px; outline:none; }
  .comment { padding:13px; margin-bottom:9px; }
  .comment-actions { display:flex; gap:14px; margin-top:8px; }
  .comment-actions button { border:0; background:transparent; color:var(--muted); padding:2px; }
  .comment-actions button.selected { color:var(--purple); font-weight:700; }
  .empty { text-align:center; padding:35px 12px; color:var(--muted); }
  iframe { width:100%; height:420px; border:0; border-radius:14px; background:#f1efff; }
  .backline { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  @media (min-width:600px) {
    main { padding-left:22px; padding-right:22px; }
    .article-card { grid-template-columns:160px 1fr; }
    .product-grid { grid-template-columns:repeat(3,minmax(0,1fr)); }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Filter menu">☰</button>
    <div class="brand">MyApp</div>
    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="Search articles, games, products…">
    </form>
  </header>
  <main id="main"></main>
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="articles"><span>📰</span><span>Articles</span></button>
    <button class="nav-item" data-tab="games"><span>🎮</span><span>Games</span></button>
    <button class="nav-item" data-tab="shop"><span>🛍️</span><span>Shopping</span></button>
    <button class="nav-item" data-tab="profile"><span>👤</span><span>Profile</span></button>
  </nav>
</div>

<div class="drawer-backdrop" id="drawerBackdrop">
  <aside class="drawer">
    <div class="drawer-top"><h2>Filter & Sort</h2><button class="icon-btn" id="closeDrawer">×</button></div>
    <div id="drawerContent"></div>
  </aside>
</div>

<script>
const articles = [
  {id:1,title:"घर को खूबसूरत बनाने के आसान तरीके",cat:"Lifestyle",date:"2026-11-12",likes:124,img:"https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=900",text:"कम बजट में भी घर को नया और आकर्षक लुक दिया जा सकता है। सही रंग, रोशनी और कुछ छोटे बदलाव आपके कमरे को बिल्कुल नया बना सकते हैं। पौधे, आरामदायक कुशन और हल्की रोशनी घर में गर्माहट लाते हैं।"},
  {id:2,title:"स्मार्टफोन खरीदने से पहले ये बातें जानें",cat:"Technology",date:"2026-11-10",likes:86,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=900",text:"नया फोन चुनते समय अपनी जरूरत के हिसाब से बैटरी, कैमरा, स्टोरेज और अपडेट सपोर्ट पर ध्यान दें। केवल बड़े नंबर देखकर फैसला न करें; फोन का रोजमर्रा का इस्तेमाल भी सोचें।"},
  {id:3,title:"रोज़मर्रा की फिटनेस के लिए छोटी आदतें",cat:"Health",date:"2026-11-08",likes:203,img:"https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=900",text:"थोड़ी-थोड़ी नियमित गतिविधि भी सेहत के लिए फायदेमंद हो सकती है। पैदल चलना, स्ट्रेचिंग और पर्याप्त आराम जैसी आदतों से शुरुआत करें और अपनी क्षमता के अनुसार आगे बढ़ें।"},
  {id:4,title:"किचन को व्यवस्थित रखने के टिप्स",cat:"Lifestyle",date:"2026-11-02",likes:59,img:"https://images.unsplash.com/photo-1556911220-bff31c812dba?w=900",text:"किचन में रोज इस्तेमाल होने वाली चीजों को पास रखें और सामान को अलग-अलग डिब्बों में रखें। इससे जगह बचेगी और खाना बनाते समय जरूरी चीजें आसानी से मिलेंगी।"}
];
const games = [
  {id:1,name:"Color Match",icon:"🎨",plays:1280,date:"2026-11-10"},
  {id:2,name:"Speed Tap",icon:"⚡",plays:920,date:"2026-11-08"},
  {id:3,name:"Memory Flip",icon:"🧠",plays:810,date:"2026-11-07"},
  {id:4,name:"Mini Cricket",icon:"🏏",plays:760,date:"2026-10-30"},
  {id:5,name:"Puzzle Pop",icon:"🧩",plays:640,date:"2026-10-25"},
  {id:6,name:"Space Run",icon:"🚀",plays:510,date:"2026-10-20"},
  {id:7,name:"Bubble Fun",icon:"🫧",plays:420,date:"2026-09-18"},
  {id:8,name:"Word Quest",icon:"🔤",plays:305,date:"2026-09-05"},
  {id:9,name:"Lucky Dice",icon:"🎲",plays:220,date:"2026-08-15"},
  {id:10,name:"Fruit Slice",icon:"🍉",plays:180,date:"2026-07-21"},
  {id:11,name:"Tiny Chess",icon:"♟️",plays:125,date:"2026-06-11"},
  {id:12,name:"Jump Ball",icon:"🏀",plays:90,date:"2026-05-02"}
];
const products = [
  {id:1,name:"Wireless Headphones",cat:"Electronics",price:1299,mrp:1999,clicks:540,date:"2026-11-10",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900",imgs:["https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900","https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=900"]},
  {id:2,name:"Classic Casual Shirt",cat:"Clothing",price:799,mrp:1299,clicks:415,date:"2026-11-09",img:"https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=900",imgs:["https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=900","https://images.unsplash.com/photo-1603252109303-2751441dd157?w=900"]},
  {id:3,name:"Everyday Backpack",cat:"Accessories",price:999,mrp:1499,clicks:290,date:"2026-11-03",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=900",imgs:["https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=900","https://images.unsplash.com/photo-1622560480654-d96214fdc887?w=900"]},
  {id:4,name:"Smart Watch",cat:"Electronics",price:1899,mrp:2999,clicks:720,date:"2026-10-28",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=900",imgs:["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=900","https://images.unsplash.com/photo-1508685096489-7aacd43bd3b1?w=900"]},
  {id:5,name:"Comfort Sneakers",cat:"Clothing",price:1499,mrp:2199,clicks:185,date:"2026-10-15",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900",imgs:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900","https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=900"]},
  {id:6,name:"Ceramic Coffee Mug",cat:"Home",price:349,mrp:599,clicks:103,date:"2026-09-20",img:"https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=900",imgs:["https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=900","https://images.unsplash.com/photo-1577937927133-66ef06acdf18?w=900"]}
];
let comments = [
  {id:1,name:"Aarav",text:"यहाँ का content काफी अच्छा लगा!",likes:8,dislikes:1,vote:0,date:Date.now()-100000},
  {id:2,name:"Neha",text:"और नए articles और games जोड़िए।",likes:5,dislikes:0,vote:0,date:Date.now()-50000}
];
let state = {tab:"articles",query:"",category:"All",sort:"Latest",time:"All time",detail:null,commentPage:false,profileName:"Guest User",played:[],galleryIndex:0};
const $ = s => document.querySelector(s);
const main = $("#main");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const agoDate = d => new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
function setTab(tab){state.tab=tab;state.detail=null;state.commentPage=false;state.category="All";state.query="";$("#searchInput").value="";render();}
function matchesQuery(item){return !state.query || JSON.stringify(item).toLowerCase().includes(state.query.toLowerCase());}
function render(){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));
  if(state.detail){renderDetail();return;}
  if(state.commentPage){renderComments();return;}
  if(state.tab==="articles") renderArticles();
  if(state.tab==="games") renderGames();
  if(state.tab==="shop") renderShop();
  if(state.tab==="profile") renderProfile();
}
function renderArticles(){
  let cats=["All",...new Set(articles.map(a=>a.cat))];
  let list=articles.filter(a=>(state.category==="All"||a.cat===state.category)&&matchesQuery(a));
  if(state.sort==="Popular") list.sort((a,b)=>b.likes-a.likes);
  else if(state.sort==="Oldest") list.sort((a,b)=>a.date.localeCompare(b.date));
  else list.sort((a,b)=>b.date.localeCompare(a.date));
  main.innerHTML=`<div class="section-head"><h1>आपके Articles</h1><span class="muted">${list.length} लेख</span></div>
    <div class="chips">${cats.map(c=>`<button class="chip ${c===state.category?"active":""}" data-category="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="article-list">${list.map(a=>`<article class="card article-card">
      <img src="${a.img}" alt="" data-open="article" data-id="${a.id}">
      <div class="article-copy"><h3>${esc(a.title)}</h3><p class="excerpt">${esc(a.text)}</p>
      <div class="row between"><button class="small-btn" data-open="article" data-id="${a.id}">Read more</button>
      <button class="like-btn" data-like-article="${a.id}">♡ ${a.likes}</button></div>
      <div class="muted">${esc(a.cat)} · ${agoDate(a.date)}</div></div></article>`).join("")||`<div class="empty">कोई article नहीं मिला।</div>`}</div>`;
}
function renderGames(){
  let list=games.filter(matchesQuery);
  if(state.sort==="Most played")list.sort((a,b)=>b.plays-a.plays);
  else if(state.sort==="Minimum played")list.sort((a,b)=>a.plays-b.plays);
  else if(state.sort==="Oldest")list.sort((a,b)=>a.date.localeCompare(b.date));
  else list.sort((a,b)=>b.date.localeCompare(a.date));
  const played=state.played.map(id=>games.find(g=>g.id===id)).filter(Boolean);
  main.innerHTML=`${played.length?`<h2>हाल में खेले गए</h2><div class="game-strip">${played.map(g=>`<div class="played" data-open="game" data-id="${g.id}"><span class="emoji">${g.icon}</span><span>${esc(g.name)}</span></div>`).join("")}</div>`:""}
    <div class="section-head"><h1>Games</h1><span class="muted">${list.length} games</span></div>
    <div class="game-grid">${list.map(g=>`<div class="card game-card" data-open="game" data-id="${g.id}"><div class="game-icon">${g.icon}</div><h3>${esc(g.name)}</h3><div class="muted">${g.plays.toLocaleString()} plays</div></div>`).join("")||`<div class="empty">कोई game नहीं मिला।</div>`}</div>`;
}
function renderShop(){
  const cats=["All",...new Set(products.map(p=>p.cat))];
  let list=products.filter(p=>(state.category==="All"||p.cat===state.category)&&matchesQuery(p));
  if(state.sort==="Most clicked")list.sort((a,b)=>b.clicks-a.clicks);
  else if(state.sort==="Minimum clicked")list.sort((a,b)=>a.clicks-b.clicks);
  else if(state.sort==="Oldest")list.sort((a,b)=>a.date.localeCompare(b.date));
  else list.sort((a,b)=>b.date.localeCompare(a.date));
  main.innerHTML=`<div class="section-head"><h1>Shopping</h1><span class="muted">चुने हुए products</span></div>
    <div class="chips">${cats.map(c=>`<button class="chip ${c===state.category?"active":""}" data-category="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="product-grid">${list.map(p=>`<div class="card product-card" data-open="product" data-id="${p.id}"><img src="${p.img}" alt="${esc(p.name)}"><div class="product-info"><h3>${esc(p.name)}</h3><div class="price">₹${p.price}<span class="mrp">₹${p.mrp}</span></div><div class="muted">${esc(p.cat)}</div></div></div>`).join("")||`<div class="empty">कोई product नहीं मिला।</div>`}</div>`;
}
function renderProfile(){
  main.innerHTML=`<div class="card profile-card"><img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Profile photo">
    <h2 style="margin:10px 0 3px">${esc(state.profileName)}</h2><div class="muted">MyApp member</div>
    <button class="secondary" style="margin-top:13px" id="editProfile">प्रोफाइल Edit करें</button></div>
    <div class="banner" id="openComments"><h2 style="margin-bottom:4px">💬 Community Comments</h2><div>अपनी बात लिखें और दूसरों की राय देखें</div></div>
    <div class="link-list">
      <div class="link-row" data-info="Privacy Policy"><span>🔒 Privacy Policy</span><span>›</span></div>
      <div class="link-row" data-info="About Us"><span>ℹ️ About Us</span><span>›</span></div>
      <div class="link-row" data-info="Contact"><span>✉️ Contact</span><span>›</span></div>
    </div>`;
}
function renderComments(){
  let list=[...comments];
  if(state.sort==="Popular"||state.sort==="Most liked")list.sort((a,b)=>b.likes-a.likes);
  if(state.sort==="Minimum liked")list.sort((a,b)=>a.likes-b.likes);
  if(state.sort==="Oldest")list.sort((a,b)=>a.date-b.date);
  main.innerHTML=`<div class="backline"><button class="icon-btn" id="backProfile">‹</button><h1>Comments</h1><button class="icon-btn" id="commentMenu" style="margin-left:auto">☰</button></div>
    <form class="comment-box" id="commentForm"><input id="commentInput" placeholder="अपना comment लिखें…" maxlength="300" required><button class="primary">Post</button></form>
    <div class="muted" style="margin-bottom:10px">कुल ${list.length} comments</div>
    ${list.map(c=>`<div class="card comment"><div class="row between"><strong>${esc(c.name)}</strong><span class="muted">${new Date(c.date).toLocaleDateString("en-IN")}</span></div>
      <div style="margin-top:7px">${esc(c.text)}</div><div class="comment-actions">
      <button class="${c.vote===1?"selected":""}" data-vote="1" data-id="${c.id}">👍 ${c.likes}</button>
      <button class="${c.vote===-1?"selected":""}" data-vote="-1" data-id="${c.id}">👎 ${c.dislikes}</button></div></div>`).join("")}`;
}
function renderDetail(){
  const {type,id}=state.detail;
  if(type==="article"){
    const a=articles.find(x=>x.id===id); if(!a)return;
    main.innerHTML=`<div class="backline"><button class="icon-btn" data-back>‹</button><span class="muted">${esc(a.cat)} · ${agoDate(a.date)}</span></div>
      <img class="detail-image" src="${a.img}" alt=""><h1 class="detail-title">${esc(a.title)}</h1>
      <div class="row"><button class="like-btn" data-like-article="${a.id}">♡ ${a.likes} Like</button><span class="muted">${agoDate(a.date)}</span></div>
      <div class="detail-panel">${esc(a.text)}<br><br>${esc(a.text)}</div>`;
  } else if(type==="game"){
    const g=games.find(x=>x.id===id); if(!g)return;
    main.innerHTML=`<div class="backline"><button class="icon-btn" data-back>‹</button><span class="muted">Game details</span></div>
      <div class="card profile-card"><div class="game-icon" style="width:90px;height:90px;font-size:48px">${g.icon}</div>
      <h1 style="margin:12px 0 5px">${esc(g.name)}</h1><div class="muted">${g.plays.toLocaleString()} बार खेला गया</div></div>
      <div class="detail-panel"><h3>Game</h3><p class="muted">यह एक demo game frame है। अपनी game की iframe URL यहां जोड़ी जा सकती है।</p>
      <button class="primary wide" id="playGame">▶ Play Game</button></div><div id="gameFrame" style="margin-top:12px"></div>`;
  } else if(type==="product"){
    const p=products.find(x=>x.id===id); if(!p)return;
    const img=p.imgs[state.galleryIndex%p.imgs.length];
    main.innerHTML=`<div class="backline"><button class="icon-btn" data-back>‹</button><span class="muted">${esc(p.cat)}</span></div>
      <img class="detail-image" src="${img}" alt="${esc(p.name)}">
      <div class="gallery">${p.imgs.map((u,i)=>`<img src="${u}" class="${i===state.galleryIndex?"active":""}" data-gallery="${i}" alt="Product photo">`).join("")}</div>
      <h1 class="detail-title">${esc(p.name)}</h1><div class="price" style="font-size:21px">₹${p.price}<span class="mrp">₹${p.mrp}</span><span class="discount">${Math.round((1-p.price/p.mrp)*100)}% off</span></div>
      <div class="muted" style="margin-top:7px">${p.clicks.toLocaleString()} बार product देखा गया · Added ${agoDate(p.date)}</div>
      <div class="detail-panel"><h3>Product details</h3><p class="muted">Category: ${esc(p.cat)}<br>यह demo product listing है। खरीदने के लिए अपना affiliate product link जोड़ें।</p>
      <button class="primary wide" id="buyProduct">Buy Product</button></div>`;
  }
}
function openDrawer(){
  const isArticle=state.tab==="articles", isGame=state.tab==="games", isShop=state.tab==="shop", isComments=state.commentPage;
  let opts=isComments?["Latest","Popular","Most liked","Minimum liked","Oldest"]:isArticle?["Latest","Popular","Trending","Today","7 days","1 month","6 months","1 year"]:isGame?["Latest","Most played","Minimum played","Oldest","1 day","1 year"]:["Latest","Most clicked","Minimum clicked","Oldest","Date added"];
  $("#drawerContent").innerHTML=`<p class="muted">Sort by</p>${opts.map(x=>`<button class="option ${state.sort===x?"active":""}" data-sort="${x}">${x}</button>`).join("")}
    ${isShop?`<p class="muted" style="margin-top:18px">Product category</p>${["All",...new Set(products.map(p=>p.cat))].map(x=>`<button class="option ${state.category===x?"active":""}" data-category="${x}">${x}</button>`).join("")}`:""}
    ${isArticle?`<p class="muted" style="margin-top:18px">Category</p>${["All",...new Set(articles.map(a=>a.cat))].map(x=>`<button class="option ${state.category===x?"active":""}" data-category="${x}">${x}</button>`).join("")}`:""}`;
  $("#drawerBackdrop").classList.add("open");
}
function closeDrawer(){$("#drawerBackdrop").classList.remove("open");}
$("#menuBtn").addEventListener("click",openDrawer);
$("#closeDrawer").addEventListener("click",closeDrawer);
$("#drawerBackdrop").addEventListener("click",e=>{if(e.target.id==="drawerBackdrop")closeDrawer();});
document.querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
$("#searchForm").addEventListener("submit",e=>{e.preventDefault();state.query=$("#searchInput").value.trim();render();});
$("#searchInput").addEventListener("input",()=>{state.query=$("#searchInput").value.trim();render();});

document.addEventListener("click",e=>{
  const target=e.target.closest("button,[data-open],[data-category],[data-sort],[data-info],[data-gallery]");
  if(!target)return;
  if(target.dataset.open){state.detail={type:target.dataset.open,id:Number(target.dataset.id)};state.galleryIndex=0;render();return;}
  if(target.dataset.category){state.category=target.dataset.category;closeDrawer();render();return;}
  if(target.dataset.sort){state.sort=target.dataset.sort;closeDrawer();render();return;}
  if(target.dataset.info){alert(target.dataset.info+" page: यहां अपनी जानकारी जोड़ें।");return;}
  if(target.dataset.gallery!==undefined){state.galleryIndex=Number(target.dataset.gallery);render();return;}
  if(target.hasAttribute("data-back")){state.detail=null;render();return;}
  if(target.id==="editProfile"){const n=prompt("अपना नाम लिखें:",state.profileName);if(n&&n.trim()){state.profileName=n.trim();render();}return;}
  if(target.id==="openComments"){state.commentPage=true;state.sort="Latest";render();return;}
  if(target.id==="backProfile"){state.commentPage=false;render();return;}
  if(target.id==="commentMenu"){openDrawer();return;}
  if(target.dataset.likeArticle){const a=articles.find(x=>x.id===Number(target.dataset.likeArticle));if(a){a.likes++;render();}return;}
  if(target.dataset.vote){const c=comments.find(x=>x.id===Number(target.dataset.id));if(c){const vote=Number(target.dataset.vote);if(c.vote===vote){if(vote===1)c.likes--;else c.dislikes--;c.vote=0;}else{if(c.vote===1)c.likes--;if(c.vote===-1)c.dislikes--;if(vote===1)c.likes++;else c.dislikes++;c.vote=vote;}render();}return;}
  if(target.id==="playGame"){
    const g=games.find(x=>x.id===state.detail.id);g.plays++;state.played=[g.id,...state.played.filter(x=>x!==g.id)];
    $("#gameFrame").innerHTML=`<iframe title="${esc(g.name)} demo game" sandbox="allow-scripts" srcdoc="<html><body style='font:20px system-ui;text-align:center;padding:55px;background:#f1efff'><h2>${g.icon} ${esc(g.name)}</h2><p>यहां आपका असली game iframe दिखेगा।</p><button onclick='this.innerText=&quot;Nice! 🎉&quot;'>Tap to play</button></body></html>"></iframe>`;
    render();return;
  }
  if(target.id==="buyProduct"){const p=products.find(x=>x.id===state.detail.id);p.clicks++;alert("यह demo है। यहां अपना affiliate link जोड़ें।");renderDetail();return;}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="commentForm"){
    e.preventDefault();const input=$("#commentInput");const text=input.value.trim();if(!text)return;
    comments.unshift({id:Date.now(),name:state.profileName,text,likes:0,dislikes:0,vote:0,date:Date.now()});renderComments();
  }
});
render();
</script>
</body>
</html>
